yolo_detector:
  ros__parameters:
    # Deployment-specific: set this to an absolute .pt, .onnx, or .engine path.
    model_path: ""

    # "topic": subscribe; "camera": open a camera; "image": repeat one file.
    source_mode: "topic"
    image_topic: "/camera/image_raw"
    camera_source: "0"
    camera_backend: "auto"  # "auto" or "gstreamer"
    camera_fps: 30.0
    camera_frame_id: "camera_optical_frame"
    image_source: ""
    image_fps: 10.0

    detections_topic: "/yolo/detections"
    annotated_image_topic: "/yolo/annotated_image"
    fps_topic: "/yolo/fps"
    publish_annotated_image: true

    # Snapshot/recording services save annotated frames here.
    capture_output_dir: ""
    record_on_start: false
    recording_fps: 10.0
    recording_codec: "mp4v"

    imgsz: 640
    conf_threshold: 0.25
    iou_threshold: 0.45
    device: ""  # Empty lets Ultralytics choose; e.g. "0", "cpu".
    class_names: ["keyboard", "monitor", "mouse"]
    log_every_n_frames: 30
